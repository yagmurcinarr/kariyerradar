[project]
name = "stajradar"
version = "0.1.0"
description = "Türkiye staj ilanlarını toplayan veri hattı ve CV eşleştirme asistanı"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sırası, B: bugbear, UP: modern sözdizimi
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
