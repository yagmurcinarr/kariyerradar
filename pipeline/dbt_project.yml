# KariyerRadar dbt projesi: raw → staging (temizlik) → marts (analiz tabloları)
name: kariyerradar
version: "1.0.0"
profile: kariyerradar

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  kariyerradar:
    staging:
      +schema: staging
      +materialized: view # her sorguda raw'dan taze okunur, yer kaplamaz
    marts:
      +schema: marts
      +materialized: table # dashboard hızlı okusun diye fiziksel tablo

seeds:
  kariyerradar:
    +schema: seeds
    skills:
      +column_types:
        case_sensitive: boolean

flags:
  send_anonymous_usage_stats: false # dbt Labs'a kullanım istatistiği gönderme
