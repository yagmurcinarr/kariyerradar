# Lokal geliştirme ortamı. Aşama 0'da sadece veritabanı var;
# api ve dashboard servisleri Aşama 7'de eklenecek.
services:
  db:
    # PostgreSQL 16 + pgvector eklentisi hazır gelen imaj (arm64 + amd64)
    image: pgvector/pgvector:pg16
    container_name: stajradar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stajradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: ${POSTGRES_DB:-stajradar}
    ports:
      # Host'ta 5433: makinede yerel bir PostgreSQL 5432'yi kullanıyorsa çakışmasın
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
